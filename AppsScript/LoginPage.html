<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:25px 15px;background:#f2f5f3;font-family:Arial,sans-serif;color:#173c32}.card{max-width:440px;margin:20px auto;padding:25px;background:#fff;border-radius:16px;box-shadow:0 5px 25px #0000000d}h2{margin:0 0 7px}.subtitle{color:#718078;font-size:13px;margin-bottom:22px}.step{font-size:12px;font-weight:bold;color:#16805d;margin:20px 0 10px}input{width:100%;padding:13px;border:1px solid #d8e0dc;border-radius:8px;margin:7px 0 13px;font-size:15px}button{width:100%;border:0;border-radius:8px;padding:14px;margin-top:10px;background:#176b50;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#64756e}.info{background:#edf6f1;padding:12px;border-radius:8px;font-size:13px;margin:12px 0;line-height:1.6}.message{margin-top:15px;font-size:13px;line-height:1.5;color:#b45309;overflow-wrap:anywhere}.success{color:#16805d}.error{color:#b42318}.photo-preview{width:100%;border-radius:10px;margin-top:10px}.hidden{display:none}
</style></head><body><div class="card"><h2>BINCO RAN NUSANTARA</h2><div class="subtitle">WAREHOUSE STAFF LOGIN</div>
<div class="step">LANGKAH 1 — SCAN QR GUDANG</div><div id="qrResult" class="info">QR gudang belum dipindai.</div><button id="scanButton" onclick="openCamera('qr')">BUKA KAMERA SCAN QR</button>
<div class="step">LANGKAH 2 — LOGIN PETUGAS</div><input id="username" placeholder="Username petugas" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password">
<div class="step">LANGKAH 3 — SELFIE PETUGAS</div><button id="selfieButton" class="secondary" onclick="openCamera('selfie')">BUKA KAMERA SELFIE</button><img id="preview" class="photo-preview hidden" alt="Pratinjau selfie"><div id="selfieStatus" class="info">Selfie belum diambil.</div>
<button id="loginButton" onclick="submitLogin()" disabled>LOGIN KE SISTEM</button><div id="message" class="message"></div></div>
<script>
const CAMERA_APP_URL='__CAMERA_APP_URL__';let barcode='',selfieBase64='',selfieMime='image/jpeg',cameraWindow=null,cameraNonce='';const message=document.getElementById('message');
function showMessage(text,type=''){message.className='message '+type;message.textContent=text}
function openCamera(mode){if(CAMERA_APP_URL.includes('__CAMERA_APP_URL__')){showMessage('Halaman kamera belum dikonfigurasi.','error');return}cameraNonce=Array.from(crypto.getRandomValues(new Uint8Array(24))).map(x=>x.toString(16).padStart(2,'0')).join('');const url=new URL(CAMERA_APP_URL);url.searchParams.set('mode',mode);url.searchParams.set('nonce',cameraNonce);url.searchParams.set('returnOrigin',location.origin);cameraWindow=window.open(url.toString(),'BINCO_CAMERA','popup,width=520,height=760');if(!cameraWindow){showMessage('Popup diblokir. Izinkan pop-up untuk aplikasi BINCO RAN.','error');return}showMessage(mode==='qr'?'Kamera scan QR dibuka di tab baru.':'Kamera selfie dibuka di tab baru.')}
window.addEventListener('message',event=>{let trustedOrigin;try{trustedOrigin=new URL(CAMERA_APP_URL).origin}catch(e){return}if(event.origin!==trustedOrigin||event.source!==cameraWindow)return;const msg=event.data;if(!msg||msg.channel!=='BINCO_CAMERA_V1'||msg.nonce!==cameraNonce)return;cameraWindow=null;cameraNonce='';if(msg.type==='camera-cancel'){showMessage('Kamera ditutup.');return}if(msg.type!=='camera-result'||!msg.data)return;if(msg.data.barcode){barcode=String(msg.data.barcode).trim();showMessage('QR terbaca. Memeriksa identitas gudang...');validateScannedWarehouse()}else if(msg.data.imageBase64){selfieBase64=msg.data.imageBase64;selfieMime=msg.data.mimeType||'image/jpeg';document.getElementById('preview').src='data:'+selfieMime+';base64,'+selfieBase64;document.getElementById('preview').classList.remove('hidden');document.getElementById('selfieStatus').textContent='Selfie berhasil diambil.';showMessage('Selfie berhasil diambil.','success');checkReady()}});
function validateScannedWarehouse(){google.script.run.withSuccessHandler(result=>{if(!result||!result.success){barcode='';document.getElementById('qrResult').textContent='QR gudang tidak dikenal atau tidak aktif.';showMessage('QR gudang tidak valid.','error');return}document.getElementById('qrResult').innerHTML='<b>Gudang terverifikasi</b><br>'+escapeHtml(result.name)+'<br>'+escapeHtml(result.code)+'<br>'+escapeHtml(result.location);showMessage('QR berhasil diverifikasi. Silakan login.','success');checkReady()}).withFailureHandler(error=>{barcode='';showMessage('Gagal memeriksa QR: '+error.message,'error')}).validateWarehouseBarcode(barcode)}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function checkReady(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;document.getElementById('loginButton').disabled=!(barcode&&u&&p&&selfieBase64)}
document.getElementById('username').addEventListener('input',checkReady);document.getElementById('password').addEventListener('input',checkReady);
function submitLogin(){const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!barcode||!username||!password||!selfieBase64){showMessage('Lengkapi QR gudang, akun, dan selfie terlebih dahulu.','error');return}document.getElementById('loginButton').disabled=true;showMessage('Memeriksa akun petugas...');google.script.run.withSuccessHandler(result=>{if(!result||!result.pendingToken){document.getElementById('loginButton').disabled=false;showMessage('Login gagal. Periksa username dan password.','error');return}showMessage('Akun terverifikasi. Menyimpan selfie...');google.script.run.withSuccessHandler(session=>{if(!session||!session.sessionId){document.getElementById('loginButton').disabled=false;showMessage('Sesi tidak berhasil dibuat. Hubungi administrator.','error');return}sessionStorage.setItem('bincoSessionId',session.sessionId);sessionStorage.setItem('bincoStaffName',session.userName||'');sessionStorage.setItem('bincoWarehouseName',session.warehouseName||'');showMessage('Login berhasil! Mengalihkan ke halaman transaksi...','success');window.top.location.href='https://script.google.com/macros/s/AKfycbxg4z4t8SKgBpigRkxtY2p7wY8MWZ4fCTLEe-v1E_7FGlV8MxIHgzGsZzcuXCx8O4dwUQ/exec?page=input'}).withFailureHandler(error=>{document.getElementById('loginButton').disabled=false;showMessage('Gagal menyimpan selfie: '+error.message,'error')}).completeStaffLogin(result.pendingToken,selfieBase64,selfieMime)}).withFailureHandler(error=>{document.getElementById('loginButton').disabled=false;showMessage('Login gagal: '+error.message,'error')}).beginStaffLogin(barcode,username,password)}
</script></body></html>
